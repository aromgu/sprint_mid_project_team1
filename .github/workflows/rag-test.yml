name: RAG Pipeline Automated Test

on:
  workflow_dispatch:
    inputs:
      run_golden_104:
        description: "Gemini 3.5 Flash Lite + Hybrid로 Golden v3 104문항 새로 실행"
        required: true
        default: false
        type: boolean

jobs:
  backend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install Python dependencies
        run: uv sync --dev --locked

      - name: Run backend tests
        run: uv run pytest --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  golden-v3-answers:
    if: ${{ inputs.run_golden_104 }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RAG_MODEL_LOCAL_ONLY: "false"
      HF_HOME: ${{ github.workspace }}/.cache/huggingface

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: hf-jhgan-ko-sroberta-${{ runner.os }}

      - name: Install Python dependencies
        run: uv sync --dev --locked

      - name: Check Gemini secret
        run: test -n "$GEMINI_API_KEY"

      - name: Generate all 104 answers from scratch
        run: |
          uv run python -m scripts.run_golden_v3_answers \
            --provider gemini-lite \
            --output reports/workflow/gemini-lite-hybrid-answers.jsonl

      - name: Verify answer count
        run: test "$(wc -l < reports/workflow/gemini-lite-hybrid-answers.jsonl)" -eq 104

      - name: Upload generated answers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-v3-gemini-lite-hybrid-${{ github.run_id }}
          path: reports/workflow/gemini-lite-hybrid-answers.jsonl
          if-no-files-found: warn
